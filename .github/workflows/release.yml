name: Build & Release InkCraft APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Sign Release APK
        run: |
          KEYSTORE=inkcraft-release.jks
          keytool -genkeypair -v -keystore "$KEYSTORE" \
            -alias inkcraft -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass inkcraft123 -keypass inkcraft123 \
            -dname "CN=InkCraft, OU=Studio, O=InkCraft, L=Tablet, ST=OS, C=US"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          RAW_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$RAW_APK" ]; then
            RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi
          mkdir -p dist
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass pass:inkcraft123 \
            --key-pass pass:inkcraft123 --out dist/InkCraft-v2.0.0.apk "$RAW_APK"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.0.0' }}
          name: InkCraft Studio v2.0.0 (macOS Aesthetic + On-Device ML)
          body: |
            ### InkCraft Studio v2.0.0
            Download `InkCraft-v2.0.0.apk` directly on your Android tablet and tap to install!

            **What's New in v2.0.0:**
            - **macOS Studio Aesthetics**: Frosted-glass floating dock, unified titlebar, Apple-inspired neutral palette, and crisp hairline borders.
            - **Pro Palm Rejection**: Ignores resting palms & hover-cooldowns so your page never jumps while writing with your hand on the screen, plus a 1-tap Page Lock.
            - **On-Device ML Handwriting-to-Text**: Powered by Google ML Kit Digital Ink Recognition — convert handwritten pages into clean digital text offline.
            - **AI Voice Read-Aloud & Smart Summary**: Listen to your handwritten notes spoken aloud via TTS and extract key bullets/action items.
          files: dist/InkCraft-v2.0.0.apk
