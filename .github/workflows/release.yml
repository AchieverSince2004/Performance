name: Build & Release InkCraft APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Sign Release APK
        run: |
          KEYSTORE=inkcraft-release.jks
          keytool -genkeypair -v -keystore "$KEYSTORE" \
            -alias inkcraft -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass inkcraft123 -keypass inkcraft123 \
            -dname "CN=InkCraft, OU=Studio, O=InkCraft, L=Tablet, ST=OS, C=US"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          RAW_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$RAW_APK" ]; then
            RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi
          mkdir -p dist
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass pass:inkcraft123 \
            --key-pass pass:inkcraft123 --out dist/Vellum-v3.0.0.apk "$RAW_APK"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v3.0.0' }}
          name: Vellum Studio v3.0.0
          body: |
            ### Vellum Studio v3.0.0
            Download `Vellum-v3.0.0.apk` directly on your Android tablet and tap to install!

            **What's New in v3.0.0:**
            - **Pro Ribbon Ink Engine**: Subdivided Catmull-Rom variable-width ribbon rendering with velocity + pressure + tilt dynamics, Graphite Pencil, and 45° Calligraphy Nib.
            - **Constrained Smooth Page Viewport**: Defaults to crisp Fit-Width sizing, remembers your preferred page scale, and constrains horizontal drift.
            - **Interactive Ruler, Lasso & Text Boxes**: Drag & rotate the straightedge ruler with live angle readout, scale/rotate/move lasso selections, and place editable text boxes.
            - **18 Pro Paper Templates**: Added Engineering Grid, Hexagonal Chemistry, Storyboard, Wireframe UI, Guitar Tab, Monthly Calendar, Habit Tracker, and Meeting Minutes.
            - **Refined macOS Typography & Vellum App Icon**.
          files: dist/Vellum-v3.0.0.apk
