name: Build & Release InkCraft APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Sign Release APK
        run: |
          KEYSTORE=inkcraft-release.jks
          keytool -genkeypair -v -keystore "$KEYSTORE" \
            -alias inkcraft -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass inkcraft123 -keypass inkcraft123 \
            -dname "CN=InkCraft, OU=Studio, O=InkCraft, L=Tablet, ST=OS, C=US"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          RAW_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$RAW_APK" ]; then
            RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi
          mkdir -p dist
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass pass:inkcraft123 \
            --key-pass pass:inkcraft123 --out dist/Vellum-v3.1.0.apk "$RAW_APK"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v3.1.0' }}
          name: Vellum Studio v3.1.0
          body: |
            ### Vellum Studio v3.1.0
            Download `Vellum-v3.1.0.apk` directly on your Android tablet and tap to install!

            **What's New in v3.1.0:**
            - **Smooth Finger Scroll & Swipe-to-Turn-Page**: Scroll up/down with one finger (when palm-safe) and swipe left/right to flip between pages effortlessly, plus `+ Page` quick button.
            - **macOS Gallery Home Screen**: Redesigned middle workspace with a *Continue Writing* spotlight card, *Start from Template* visual strip, Apple Books-style notebook cards with clean below-card metadata, and Grid/List segmented view.
          files: dist/Vellum-v3.1.0.apk
