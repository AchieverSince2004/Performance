name: Build & Release InkCraft APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Sign Release APK
        run: |
          KEYSTORE=inkcraft-release.jks
          keytool -genkeypair -v -keystore "$KEYSTORE" \
            -alias inkcraft -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass inkcraft123 -keypass inkcraft123 \
            -dname "CN=InkCraft, OU=Studio, O=InkCraft, L=Tablet, ST=OS, C=US"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          RAW_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$RAW_APK" ]; then
            RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi
          mkdir -p dist
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass pass:inkcraft123 \
            --key-pass pass:inkcraft123 --out dist/InkCraft-v1.0.0.apk "$RAW_APK"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: InkCraft Tablet Studio v1.0.0
          body: |
            ### InkCraft — Tablet Stylus Note-Taking Studio
            Download `InkCraft-v1.0.0.apk` directly on your Android tablet and tap to install!

            **Highlights:**
            - True stylus pressure & tilt ink engine (Fountain, Ballpoint, Fineliner, Brush, Highlighter, Laser Pointer)
            - Stylus-only palm rejection + 2-finger pinch zoom & pan + side-button / flip-eraser support
            - Hold-to-snap geometric shapes, Straightedge Ruler overlay, and Noteshelf-style Zoom Box
            - 10 Paper Templates (Cornell, Ruled, Dot Grid, Isometric, Music Staff, Daily/Weekly Planners) & 5 Paper Colors
            - PDF Import & Annotation, Image insertion, Sticky Notes, Audio Memos, Pomodoro Timer & Multi-page PDF Export
          files: dist/InkCraft-v1.0.0.apk
